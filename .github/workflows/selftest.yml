name: Self-test

# Validates the reusable go-ci.yml against the selftest/ fixture, so any change
# to go-ci.yml is proven end-to-end (build/vet/gofmt/tidy/make ci/govulncheck +
# revive/tokei analyze) IN meta, before the consuming repos re-pin to it.
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      coverage-ref:
        description: "Exact commit SHA for a one-time tools coverage baseline (empty = current commit)"
        required: false
        type: string

permissions: read-all

jobs:
  selftest:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/go-ci.yml
    with:
      go-floor: "1.19"
      working-directory: "selftest"
    secrets: inherit

  # Tests meta's own gate tools (doccov / covcheck / footprint, in the root
  # module). go-ci.yml fetches these via `go run`, so they must stay green.
  tools:
    name: meta tools
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.coverage-ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.19.x"
      - run: go test -race -coverprofile=coverage-tools.txt ./...
      - name: Upload tools coverage
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage-tools.txt
          override_commit: ${{ inputs.coverage-ref }}
          disable_search: true
          fail_ci_if_error: true
